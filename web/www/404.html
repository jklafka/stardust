<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d17">
  <meta name="robots" content="noindex">
  <title>Page not found - Stardust</title>
  <style>
    :root {
      color-scheme: dark;
      --space: #0b0d17;
      --text: #eef0fa;
      --muted: #a4a9c6;
      --accent: #ffd75f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--space);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      color: var(--text);
      background: var(--space);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      max-width: 420px;
      text-align: center;
    }

    p {
      margin: 0;
    }

    .code {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 2rem;
      letter-spacing: 0.04em;
    }

    .message {
      color: var(--muted);
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 22px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--space);
      font-weight: 600;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p class="message">This page drifted off into deep space. Let's get you back to the board.</p>
    <a href="/">Play Stardust</a>
  </main>
</body>
</html>
